[package]
name = "fluoderpod_render"
version = "0.1.0"
edition = "2021"
authors = ["Fluorite Engine Contributors"]
description = "GPU-Driven Rendering Architecture utilizing fluoderpod batching"

[lib]
name = "fluoderpod_render"
crate-type = ["cdylib", "rlib"]

[features]
# Default keeps today's behaviour: everything builds.
default = ["nexus", "reticulum", "webrtc-stream", "xr"]
# Minimal Android render build: wgpu(+hal) / ash / tokio-rt / jni / ndk / ndk-sys only.
#   cargo ndk ... build --release --no-default-features --features android-render
android-render = []
# Nexus WebSocket client (tokio-tungstenite).
nexus = ["dep:tokio-tungstenite", "tokio/net"]
# Reticulum mesh bridge.
reticulum = ["dep:reticulum"]
# WebRTC streaming + signalling (needs nexus transport).
webrtc-stream = ["nexus", "dep:webrtc", "dep:bytes", "dep:futures-util"]
# OpenXR session support.
xr = ["dep:openxr"]
[dependencies]
wgpu = "0.20"
bytemuck = { version = "1.16", features = ["derive"] }
log = "0.4"
futures-util = { version = "0.3.28", optional = true }
serde = { version = "1.0.180", features = ["derive"] }
serde_json = "1.0.100"
bytes = { version = "1.12.1", optional = true }
wgpu-hal = { version = "0.21.1", features = ["vulkan"] }
openxr = { version = "0.22.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.30.0", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.20.0", optional = true }
webrtc = { version = "0.11.0", optional = true }
ash = "0.37.3"
reticulum = { version = "0.1", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk = "0.9.0"
ndk-sys = "0.6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wgpu = { version = "0.20", features = ["webgpu"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Performance", "Navigator", "Gpu", "console", "CssStyleDeclaration", "HtmlElement"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.2"
features = ["js"]
